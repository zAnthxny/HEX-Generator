<style>
/* Layout: una sola columna con tres pestañas (Colores / Letras / Símbolos). En el celular las pestañas
   son una barra flotante abajo, con icono y nombre. Gris medio con una "linterna" plateada que sigue al dedo o al cursor.
   Dos temas: oscuro (por defecto) y claro, con el botón de sol y luna junto a los idiomas. */
:root {
  color-scheme: dark;
  --ink: #26282d;
  --deck: #303238;
  --raised: #3c3f46;
  --field: #212327;
  --rule: #42454d;
  --rule-2: #555962;
  --text: #f4f5f7;
  --muted: #c9ccd3;
  --dim: #9da1ab;
  --accent: #aab4ff;
  --accent-ink: #1c2040;
  --accent-suave: #aab4ff22;
  --hover: #ffffff14;
  --sombra: #00000070;
  --holder: #7f848e;
  --silver: 236, 239, 245;
  --luz: 1;
  --warn: #ffd27a;
  /* Vidrio líquido de la barra */
  --vidrio: rgba(44, 46, 52, .72);
  --vidrio-borde: rgba(255, 255, 255, .16);
  --vidrio-brillo: rgba(255, 255, 255, .28);
  --vidrio-activo: rgba(255, 255, 255, .11);
  --tab-texto: #a6aab3;
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --sans: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Noto Sans", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  /* Resorte: se pasa un poco de su lugar y vuelve, como si pesara. */
  --resorte: linear(0, 0.047, 0.163, 0.318, 0.487, 0.65, 0.795, 0.914, 1.005, 1.068, 1.107, 1.124, 1.125, 1.115, 1.098, 1.077, 1.056, 1.036, 1.019, 1.006, 0.996, 0.989, 0.985, 0.984, 0.985, 0.986, 0.989, 0.991, 0.994, 0.996, 0.998, 1, 1);
  --suave: cubic-bezier(.2, .8, .2, 1);
}
:root[data-theme="light"] {
  color-scheme: light;
  --ink: #e6e8ec;
  --deck: #f5f6f8;
  --raised: #ffffff;
  --field: #eceef1;
  --rule: #d4d7de;
  --rule-2: #c0c4cd;
  --text: #1c1e23;
  --muted: #474b54;
  --dim: #6a6f79;
  --accent: #4b57d1;
  --accent-ink: #ffffff;
  --accent-suave: #4b57d11c;
  --hover: #0000000d;
  --sombra: #0000002e;
  --holder: #8b9099;
  --silver: 120, 130, 155;
  --luz: .8;
  --warn: #9a6400;
  --vidrio: rgba(250, 251, 253, .72);
  --vidrio-borde: rgba(255, 255, 255, .75);
  --vidrio-brillo: rgba(255, 255, 255, .9);
  --vidrio-activo: rgba(255, 255, 255, .7);
  --tab-texto: #5b606a;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--text); font: 15px/1.5 var(--sans); min-height: 100%; }
/* Linterna de fondo: un halo plateado donde está el dedo o el cursor */
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: radial-gradient(420px circle at var(--x, 50%) var(--y, -30%), rgba(var(--silver), calc(.10 * var(--luz) * var(--on, 0))), transparent 65%);
  transition: opacity .3s; }
.wrap { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; padding-inline: 18px; padding-block: 22px 60px; display: flex; flex-direction: column; gap: 14px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::placeholder { color: var(--holder); opacity: 1; }

.top { display: flex; align-items: center; gap: 8px; }
.top h1 { flex: 1; }
.logo { width: 38px; height: 38px; flex: none; object-fit: contain; }
/* Tema: sol (claro) y luna (oscuro) */
.tema { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--rule-2); background: var(--raised); display: grid; place-items: center; padding: 0; color: var(--text); overflow: hidden; }
.tema svg { grid-area: 1 / 1; width: 18px; height: 18px; transition: transform .45s var(--resorte), opacity .25s; }
.tema .sol { transform: rotate(-90deg) scale(.4); opacity: 0; }
[data-theme="light"] .tema .sol { transform: none; opacity: 1; }
[data-theme="light"] .tema .luna { transform: rotate(90deg) scale(.4); opacity: 0; }
h1 { font: 700 22px/1.2 var(--display); margin: 0; min-width: 0; }

/* ---- Idioma: un botón que se estira hasta ser el menú (la caja nunca desaparece) ---- */
.idioma { position: relative; flex: none; height: 38px; }
.idioma-caja { position: absolute; inset-inline-end: 0; top: 0; z-index: 30; overflow: hidden; background: var(--raised); border: 1px solid var(--rule-2); border-radius: 12px;
  transition: width .45s var(--suave), height .45s var(--suave), border-radius .45s var(--suave), box-shadow .45s; box-shadow: 0 0 0 transparent; }
.idioma-caja.abierta { border-radius: 16px; box-shadow: 0 18px 40px var(--sombra); }
.idioma-boton { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; background: none; border: 0; white-space: nowrap; font-size: 14px; font-weight: 500; }
.idioma-boton svg { transition: transform .35s var(--suave); }
.abierta .idioma-boton svg { transform: rotate(180deg); }
.idioma-lista { list-style: none; margin: 0; padding: 4px 6px 8px; }
.idioma-lista button { width: 100%; text-align: start; background: none; border: 0; border-radius: 9px; padding: 7px 10px; font-size: 14px; color: var(--muted); opacity: 0; transform: translateY(-4px); transition: opacity .2s, transform .2s, background .15s; }
.abierta .idioma-lista button { opacity: 1; transform: none; transition-delay: calc(.18s + var(--i) * 25ms); }
.idioma-lista button:hover, .idioma-lista button:focus-visible { background: var(--hover); color: var(--text); }
.idioma-lista button[aria-current="true"] { color: var(--accent); font-weight: 700; }

/* ---- Pestañas (barra con icono y nombre) ---- */
/* PC: una tarjeta del mismo ancho que las demás, con las tres pestañas repartidas */
.tabs { position: relative; isolation: isolate; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 6px; border-radius: 16px; background: var(--deck); border: 1px solid var(--rule); }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; border: 0; border-radius: 11px; background: transparent; padding: 8px 12px 7px; color: var(--tab-texto); font-size: 13px; font-weight: 500; transition: background .25s, color .2s, box-shadow .25s; }
.tabs button svg { width: 23px; height: 23px; transform: scale(calc(1 + var(--lupa, 0) * .45)) translateY(calc(var(--lupa, 0) * -3px)); transition: transform .12s ease-out; }
.tabs button[aria-selected="true"] { color: var(--accent); background: var(--accent-suave); box-shadow: inset 0 0 0 1px var(--accent-suave); }
.tabs button:hover { color: var(--text); }
.tabs button[aria-selected="true"]:hover { color: var(--accent); }
.panel { display: flex; flex-direction: column; gap: 14px; }
.panel.aparece { animation: aparecer .26s ease both; }
@keyframes aparecer { from { opacity: 0; } }

/* ---- Tarjetas con linterna: brillo por dentro y borde plateado cerca del dedo ---- */
.caja, .estilo, .escena-marco { position: relative; }
.caja { border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; border: 1px solid var(--rule);
  background: radial-gradient(320px circle at var(--lx, -999px) var(--ly, -999px), rgba(var(--silver), calc(.09 * var(--on, 0))), transparent 70%), var(--deck); }
.caja::before, .estilo::before { content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px; pointer-events: none;
  background: radial-gradient(220px circle at var(--lx, -999px) var(--ly, -999px), rgba(var(--silver), calc(.75 * var(--on, 0))), transparent 65%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.caja > h2 { margin: 0; font: 700 13px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: center; }
.fila { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.fila.centro { justify-content: center; }
.fila.entre { justify-content: space-between; }

#codigo { width: 100%; min-height: 76px; resize: vertical; background: var(--field); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 12px; font: 13px/1.5 var(--mono); word-break: break-all; }
.medida { font: 12px var(--mono); color: var(--dim); }
.medida.pasa { color: var(--warn); }

/* ---- Vista previa ---- */
.vistas { display: flex; justify-content: center; gap: 4px; }
.vistas button { background: none; border: 0; border-bottom: 2px solid transparent; padding: 4px 10px 6px; color: var(--muted); font-size: 14px; }
.vistas button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 700; }
.escena { border-radius: 12px; overflow: hidden; min-height: 150px; display: flex; color: #fff; font-size: 19px; line-height: 1.35; }
.escena.simple { background: #1e1f22; align-items: center; justify-content: center; padding: 20px 16px; text-align: center; font-size: 30px; }
/* Chat: un paisaje de Minecraft en pixel art (Overworld de día y de noche, Nether, End) */
.escena.mundo { position: relative; min-height: 200px; background: #10131a center 62% / cover no-repeat; image-rendering: pixelated; }
.escena.mundo.cambia { animation: aparecer .35s ease both; }
.escena.mundo .chat { inset-inline-end: auto; max-width: min(560px, calc(100% - 20px)); text-shadow: 2px 2px 0 rgba(0, 0, 0, .55); }
.fondo-nav { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 8px; pointer-events: none; }
.fondo-nav button { pointer-events: auto; width: 32px; height: 32px; border: 0; border-radius: 8px; background: rgba(14, 16, 22, .82); color: #fff; display: grid; place-items: center; padding: 0; }
.fondo-nav button:hover { background: rgba(14, 16, 22, .95); }
.fondo-nav .der svg { transform: scaleX(-1); }
.fondo-nombre { background: #fff; color: #1d1f24; border: 2px solid #1d1f24; border-radius: 999px; padding: 1px 12px; font: 600 13px var(--mono); white-space: nowrap; text-shadow: none; }
.chat { position: absolute; inset-inline: 10px; bottom: 12px; max-width: 600px; background: rgba(0,0,0,.55); padding: 6px 9px; display: flex; flex-direction: column; gap: 2px; z-index: 1; font-size: 17px; }
.gris { color: #aaa; } .blanco { color: #fff; } .amarillo { color: #ff5; } .verde { color: #5f5; }
.vacio { color: #777; font-weight: 400; }
.escena.inv { background: #c6c6c6; align-items: flex-start; justify-content: center; padding: 22px 12px; }
.slot { width: 56px; height: 56px; flex: none; background: #8b8b8b; border: 3px solid; border-color: #373737 #fff #fff #373737; display: grid; place-items: center; margin-top: 4px; }
.slot svg { width: 44px; height: 44px; }
.tooltip { margin-inline-start: 10px; min-width: 0; max-width: 100%; background: #100010f2; padding: 6px 10px 8px; border: 2px solid #100010; outline: 2px solid #5000ff; outline-offset: -4px; font-size: 17px; }
.tooltip .nombre { overflow-wrap: anywhere; margin-bottom: 4px; }

#texto { width: 100%; background: var(--field); border: 1px solid var(--rule); border-radius: 12px; padding: 12px 14px; font-size: 18px; text-align: center; }
.aviso-emoji { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: #ffd27a14; border: 1px solid #ffd27a55; border-radius: 10px; padding: 8px 10px; font-size: 13px; color: var(--warn); margin-top: 8px; }
.aviso-emoji button { background: var(--raised); border: 1px solid var(--rule-2); border-radius: 8px; padding: 3px 9px; font-size: 13px; color: var(--text); }

.contador { display: inline-flex; align-items: center; gap: 12px; }
.redondo { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--rule-2); background: var(--raised); font-size: 20px; line-height: 1; }
.redondo:disabled { opacity: .35; cursor: default; }
.contador b { font: 700 22px var(--mono); min-width: 2ch; text-align: center; }
.dado { border: 1px solid var(--accent); background: var(--accent-suave); color: var(--text); border-radius: 12px; padding: 8px 20px; font-weight: 700; }
.paleta { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
/* Tarjetas grandes: la muestra entera se toca para elegir el color; candado y cuentagotas van abajo, aparte */
.color { width: 128px; border: 1px solid var(--rule-2); border-radius: 14px; background: var(--field); padding: 8px; display: flex; flex-direction: column; gap: 8px; cursor: grab; }
.color.fijo { border-color: var(--warn); }
.color.arrastrando { opacity: .4; }
.color.sobre { border-color: var(--accent); }
/* Spring: la tarjeta cae, se pasa un poquito de su lugar y vuelve */
.color.cae { animation: caer .8s var(--resorte) both; animation-delay: calc(var(--i, 0) * 70ms); }
@keyframes caer { from { opacity: 0; transform: translateY(-38px); } 30% { opacity: 1; } }
.muestra { position: relative; height: 72px; border-radius: 9px; overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
.muestra input { position: absolute; inset: -8px; width: calc(100% + 16px); height: calc(100% + 16px); border: 0; padding: 0; cursor: pointer; opacity: 0; }
.acciones { display: flex; gap: 6px; }
.candado, .gotero { flex: 1; height: 32px; border-radius: 9px; border: 1px solid var(--rule-2); background: var(--raised); color: var(--text); padding: 0; display: grid; place-items: center; font-size: 14px; }
.candado[aria-pressed="true"] { border-color: var(--warn); background: #ffd27a22; }
.gotero svg { width: 15px; height: 15px; }
.color .pie { display: flex; justify-content: space-between; align-items: center; font: 12px var(--mono); color: var(--dim); direction: ltr; }
.color .pie input { width: 8ch; background: transparent; border: 0; padding: 2px 0; font: 600 13px var(--mono); color: var(--text); text-align: right; }
.color .pie input.mal { color: #ff8fa6; }
.tip { font-size: 12px; color: var(--dim); text-align: center; margin: 0; }
.recientes { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.reciente { width: 64px; height: 22px; border-radius: 6px; border: 1px solid var(--rule-2); padding: 0; }
.pegar { display: flex; gap: 8px; }
.pegar input { flex: 1; min-width: 0; background: var(--field); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; font: 13px var(--mono); direction: ltr; }

.check { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--rule-2); background: var(--raised); border-radius: 999px; padding: 5px 12px 5px 9px; font-size: 14px; cursor: pointer; }
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-suave); }
.check input { accent-color: var(--accent); margin: 0; }
.chip { border: 1px solid var(--rule-2); background: var(--raised); border-radius: 999px; padding: 5px 12px; font-size: 14px; }
.separa { height: 1px; background: var(--rule); }

.campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.campos label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--dim); text-align: center; min-width: 0; }
select { width: 100%; background: var(--field); border: 1px solid var(--rule); border-radius: 10px; padding: 8px 10px; }
.boton { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 700; font-size: 14px; }
.boton.suave { background: var(--raised); color: var(--text); border: 1px solid var(--rule-2); font-weight: 500; }

/* ---- Letras ---- */
#textoLetras { width: 100%; min-height: 64px; resize: vertical; background: var(--field); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; font-size: 18px; }
.lista { display: flex; flex-direction: column; gap: 6px; }
.estilo { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 10px; border: 1px solid var(--rule); border-radius: 12px; padding: 8px 10px;
  background: radial-gradient(240px circle at var(--lx, -999px) var(--ly, -999px), rgba(var(--silver), calc(.08 * var(--on, 0))), transparent 70%), var(--deck); }
.estilo .res { font-size: 18px; overflow-wrap: anywhere; min-width: 0; }
.mini { background: var(--raised); border: 1px solid var(--rule-2); border-radius: 8px; padding: 5px 10px; font-size: 12px; color: var(--muted); white-space: nowrap; }
.mini.ok { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.tag { font: 600 10px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: #8ff0c4; border: 1px solid #8ff0c455; border-radius: 5px; padding: 0 5px; margin-inline-start: 6px; white-space: nowrap; vertical-align: 2px; }
/* Stagger: cada fila entra una décima de segundo después de la anterior */
.entra { animation: subir .4s var(--suave) both; animation-delay: calc(var(--i, 0) * 100ms); }
@keyframes subir { from { opacity: 0; transform: translateY(12px); } }

/* ---- Símbolos ---- */
.seg { display: inline-flex; border: 1px solid var(--rule-2); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 6px 12px; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.cat h3 { margin: 0 0 6px; font: 600 11px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.simbolos { display: flex; flex-wrap: wrap; gap: 5px; }
.simbolo { position: relative; min-width: 40px; height: 40px; padding: 0 8px; border-radius: 9px; border: 1px solid var(--rule); background: var(--field); font-size: 20px; line-height: 1;
  font-family: "Segoe UI Symbol", "Noto Sans Symbols 2", "Noto Sans Symbols", "DejaVu Sans", var(--sans); font-variant-emoji: text;
  transform: scale(calc(1 + var(--lupa, 0) * .55)); transition: transform .12s ease-out, border-color .12s; z-index: calc(1 + round(var(--lupa, 0) * 10)); }
.simbolo:hover { border-color: var(--accent); }
.simbolo.largo { font-size: 15px; letter-spacing: 1px; }

#aviso { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: #f0f2f6; color: #23252b; font-weight: 700; padding: 8px 16px; border-radius: 12px; opacity: 0; transition: .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; z-index: 40; }
#aviso.ver { opacity: 1; transform: translateX(-50%) translateY(0); }

/* Crossfade y elemento compartido (transiciones de vista del navegador) */
::view-transition-old(root), ::view-transition-new(root) { animation-duration: .26s; animation-timing-function: ease; }
::view-transition-group(titulo) { animation-duration: .55s; animation-timing-function: var(--suave); z-index: 5; }
::view-transition-old(titulo), ::view-transition-new(titulo) { animation-duration: .55s; height: 100%; object-fit: contain; }

/* Celular: la barra de pestañas flota abajo, como una app */
@media (max-width: 640px) {
  .wrap { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  /* Vidrio líquido (solo celular): fondo translúcido que desenfoca y satura lo de atrás, con brillo en el borde de arriba */
  .tabs { position: fixed; z-index: 25; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--vidrio); border: 1px solid var(--vidrio-borde);
    backdrop-filter: blur(22px) saturate(180%); -webkit-backdrop-filter: blur(22px) saturate(180%);
    box-shadow: inset 0 1px 0 var(--vidrio-brillo), inset 0 -1px 1px rgba(255,255,255,.05), 0 10px 28px var(--sombra); }
  .tabs::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: -1;
    background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,0) 55%), radial-gradient(120% 90% at 50% 120%, rgba(255,255,255,.08), transparent 60%); }
  .tabs button { min-width: 76px; gap: 1px; border-radius: 999px; padding: 5px 12px 4px; font-size: 11.5px; }

    if (!window.EyeDropper) return "";
    return '<button type="button" class="gotero" aria-label="' + esc(T("cuentagotas")) + " #" + (i + 1) + '" title="' + esc(T("cuentagotas")) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      '<path d="m18.5 2.5 3 3-3.2 3.2 1.2 1.2-2 2-1.2-1.2L8 18l-4 1 1-4 7.3-7.3-1.2-1.2 2-2 1.2 1.2Z"/></svg></button>';
  }

  // caen: "todas", un índice, o una lista de índices que entran cayendo con rebote
  function paleta(caen) {
    $("cuantos").textContent = S.colores.length;
    $("menos").disabled = S.colores.length <= 1;
    $("mas").disabled = S.colores.length >= 10;
    var c = $("paleta"); c.innerHTML = ""; var n = 0;
    S.colores.forEach(function (h, i) {
      var d = document.createElement("div"); d.className = "color" + (S.fijos[i] ? " fijo" : ""); d.draggable = true;
      if (!SIN_MOV.matches && (caen === "todas" || caen === i || (Array.isArray(caen) && caen.indexOf(i) >= 0))) { d.classList.add("cae"); d.style.setProperty("--i", n++); }
      d.innerHTML = '<div class="muestra" style="background:' + h + '"><input type="color" id="c' + i + '" value="' + h.toLowerCase() + '" aria-label="#' + (i + 1) + '"></div>' +
        '<div class="pie"><span>#' + (i + 1) + '</span><input type="text" id="h' + i + '" value="' + h.slice(1).toLowerCase() + '" maxlength="7" spellcheck="false" aria-label="HEX #' + (i + 1) + '"></div>' +
        '<div class="acciones">' + GOTERO(i) +
        '<button type="button" class="candado" aria-pressed="' + S.fijos[i] + '" aria-label="🔒 #' + (i + 1) + '">' + (S.fijos[i] ? "🔒" : "🔓") + "</button></div>";
      var gota = d.querySelector(".gotero");
      if (gota) gota.onclick = function (e) {
        e.preventDefault();
        try {
          new window.EyeDropper().open().then(function (r) {
            S.colores[i] = String(r.sRGBHex).toUpperCase(); S.fijos[i] = S.fijos[i];
            $("preajuste").value = "-"; paleta(i); vista();
          }, function () {});
        } catch (err) {}
      };
      var pick = d.querySelector("input[type=color]"), txt = d.querySelector("input[type=text]"), m = d.querySelector(".muestra");
      pick.oninput = function () { S.colores[i] = pick.value.toUpperCase(); m.style.background = pick.value; txt.value = pick.value.slice(1); txt.classList.remove("mal"); vista(); };
      txt.oninput = function () {
        var v = txt.value.trim().replace("#", "");
        if (/^[0-9a-fA-F]{6}$/.test(v)) { S.colores[i] = "#" + v.toUpperCase(); pick.value = "#" + v.toLowerCase(); m.style.background = "#" + v; txt.classList.remove("mal"); vista(); }
        else txt.classList.add("mal");
      };
      d.querySelector(".candado").onclick = function (e) { e.preventDefault(); S.fijos[i] = !S.fijos[i]; paleta(); };
      txt.ondragstart = function (e) { e.preventDefault(); };
      d.ondragstart = function (e) { d.classList.add("arrastrando"); e.dataTransfer.setData("text/plain", String(i)); e.dataTransfer.effectAllowed = "move"; };
      d.ondragend = function () { d.classList.remove("arrastrando"); };
      d.ondragover = function (e) { e.preventDefault(); d.classList.add("sobre"); };
      d.ondragleave = function () { d.classList.remove("sobre"); };
      d.ondrop = function (e) {
        e.preventDefault(); d.classList.remove("sobre");
        var de = parseInt(e.dataTransfer.getData("text/plain"), 10);
        if (isNaN(de) || de === i) return;
        var mc = S.colores.splice(de, 1)[0], mf = S.fijos.splice(de, 1)[0];
        S.colores.splice(i, 0, mc); S.fijos.splice(i, 0, mf);
        $("preajuste").value = "-"; paleta(); vista();
      };
      c.appendChild(d);
    });
  }

  // Aleatorio: elige un tono base y reparte los demás con una regla que suele quedar bien
  function aleatorio() {
    var fijo = S.colores.findIndex(function (_, i) { return S.fijos[i]; });
    var base = fijo >= 0 ? tono(S.colores[fijo]) : Math.random() * 360;
    var paso = [30, 40, 180, 150, -35][Math.floor(Math.random() * 5)];
    var sat = 70 + Math.random() * 25, n = S.colores.length, cambiados = [];
    S.colores = S.colores.map(function (h, i) {
      if (S.fijos[i]) return h;
      cambiados.push(i);
      var t = n > 1 ? i / (n - 1) : 0;
      return hsl(base + paso * t * (n > 2 ? 1.4 : 1) + (Math.random() * 16 - 8), sat, 58 + Math.random() * 12);
    });
    $("preajuste").value = "-"; paleta(cambiados); vista();
  }

  // Pegar: lee los colores, el texto y el formato de un código que ya tienes
  function cargarCodigo() {
    var s = $("pegado").value.trim();
    if (!s) return avisar(T("pegaPrimero"));
    var cols = [], m, formato = "hex";
    var reX = /[&§]x((?:[&§][0-9a-fA-F]){6})/g;
    if (/[&§]x(?:[&§][0-9a-fA-F]){6}/.test(s)) { formato = s.indexOf("§") >= 0 ? "sec" : "x"; s.replace(reX, function (_, g) { cols.push("#" + g.replace(/[&§]/g, "")); return ""; }); }
    var reG = /<gradient:([^>]+)>/i.exec(s);
    if (reG) { formato = "mini"; reG[1].split(":").forEach(function (h) { if (/^#[0-9a-f]{6}$/i.test(h)) cols.push(h); }); }
    if (!cols.length) {
      var reH = /#([0-9a-fA-F]{6})/g;
      while ((m = reH.exec(s))) cols.push("#" + m[1]);
      if (/\[COLOR=/i.test(s)) formato = "bb"; else if (/<#/.test(s)) formato = "llave"; else if (/<color:/i.test(s)) formato = "mini";
    }
    if (!cols.length) {
      var reC = /[&§]([0-9a-fA-F])/g, cl = [];
      while ((m = reC.exec(s))) {
        var cc = CLASICOS.filter(function (x) { return x[0] === m[1].toLowerCase(); })[0];
        if (cc) cl.push(cc[1]);
      }
      if (cl.length) { cols = cl; formato = "clasico"; }
    }
    if (!cols.length) return avisar(T("noColores"));
    if (/^\/nick /.test(s) && formato === "hex") formato = "nick";
    cols = cols.map(function (h) { return h.toUpperCase(); });
    // Un código letra por letra trae un color por letra: me quedo con los colores clave
    if (cols.length > 3) {
      var mid = cols[Math.floor(cols.length / 2)], ini = cols[0], fin = cols[cols.length - 1];
      var a = hexRgb(mid), b = hexRgb(mezclar(ini, fin, 0.5));
      cols = Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]) < 40 ? [ini, fin] : [ini, mid, fin];
    }
    var texto = s.replace(/^\/nick /, "").replace(reX, "").replace(/<[^>]*>/g, "").replace(/\[\/?[^\]]*\]/g, "").replace(/[&§]#[0-9a-fA-F]{6}/g, "").replace(/[&§][0-9a-fk-orA-FK-OR]/g, "");
    S.negrita = /[&§]l|<b>|<bold>|\[B\]/i.test(s); S.cursiva = /[&§]o|<i>|<italic>|\[I\]/i.test(s);
    S.subrayado = /[&§]n|<u>|<underlined>|\[U\]/i.test(s); S.tachado = /[&§]m|<st>|<strikethrough>|\[S\]/i.test(s);
    ["negrita", "cursiva", "subrayado", "tachado"].forEach(function (k) { $(k).checked = S[k]; });
    if (texto.trim()) { S.texto = texto; $("texto").value = texto; }
    S.formato = formato; $("formato").value = formato;
    usarColores(cols);
    avisar(T("cargados", cols.length));
  }

  // ---------- Letras ----------
  function letras(animar) {
    var t = $("textoLetras").value || T("placeholder").replace("…", ""), c = $("lista"); c.innerHTML = "";
    revisar($("textoLetras"), "avisoLetras", function () { letras(); });
    LETRAS.forEach(function (l) {
      var r = l.f(t);
      var d = document.createElement("div"); d.className = "estilo";
      d.innerHTML = '<span class="res"></span><button class="mini" type="button" data-a="colores"></button><button class="mini ok" type="button" data-a="copiar"></button>';
      var res = d.querySelector(".res"), txt = document.createElement("span"); txt.textContent = r; res.appendChild(txt);
      if (l.mc) { var tg = document.createElement("span"); tg.className = "tag"; tg.textContent = "Minecraft"; res.appendChild(tg); }
      d.querySelector('[data-a="colores"]').textContent = T("aColores");
      d.querySelector('[data-a="copiar"]').textContent = T("copiar");
      d.querySelector('[data-a="copiar"]').onclick = function () { copiar(r, null); };
      // Elemento compartido: el texto de la fila viaja hasta la vista previa de Colores
      d.querySelector('[data-a="colores"]').onclick = function () {
        S.texto = r; $("texto").value = r; S.vista = "simple";
        document.querySelectorAll("[data-vista]").forEach(function (x) { x.setAttribute("aria-pressed", x.dataset.vista === "simple"); });
        transicion(function () { mostrar("colores"); vista(); window.scrollTo(0, 0); }, [{ de: txt, a: "#escena .titulo-prev", nombre: "titulo" }]);
        avisar(T("listo"));
      };
      c.appendChild(d);
    });
    if (animar) escalonar(c.children);
  }

  // ---------- Símbolos ----------
  function simbolos(animar) {
    var c = $("categorias"); c.innerHTML = "";
    SIMBOLOS.forEach(function (cat) {
      var lista = Array.isArray(cat[1]) ? cat[1] : Array.from(cat[1]);
      lista = lista.filter(function (s) { return !malo(s); });
      var d = document.createElement("div"); d.className = "cat";
      d.innerHTML = "<h3>" + esc(T(cat[0])) + '</h3><div class="simbolos"></div>';
      var g = d.querySelector(".simbolos");
      lista.forEach(function (s) {
        var b = document.createElement("button"); b.type = "button"; b.className = "simbolo" + (Array.from(s).length > 1 ? " largo" : ""); b.textContent = s;
        b.onclick = function () {
          if (S.modoSimbolo === "copiar") return copiar(s, null);
          S.texto = (S.texto || "") + s; $("texto").value = S.texto; vista(); avisar(T("anadido") + ": " + s);
        };
        g.appendChild(b);
      });
      c.appendChild(d);
    });
    if (animar) escalonar(c.children);
  }

  // ---------- Pestañas (crossfade) ----------
  var actual = "colores";
  function mostrar(cual) {
    ["colores", "letras", "simbolos"].forEach(function (p) {
      $("tab-" + p).setAttribute("aria-selected", p === cual);
      $("p-" + p).hidden = p !== cual;
    });
    actual = cual;
  }
  function pestana(cual) {
    if (cual === actual) return;
    var hubo = transicion(function () { mostrar(cual); });
    if (!hubo && !SIN_MOV.matches) { var p = $("p-" + cual); p.classList.remove("aparece"); void p.offsetWidth; p.classList.add("aparece"); }
    if (cual === "letras") { escalonar($("lista").children); escribirPlaceholder($("textoLetras")); }
    if (cual === "simbolos") escalonar($("categorias").children);
    if (cual === "colores") escribirPlaceholder($("texto"));
  }

  // ---------- Idioma (morph: el botón se estira hasta ser el menú) ----------
  var caja = $("idiomaCaja"), boton = $("idiomaBoton");
  function medirCerrada() {
    caja.style.width = "auto"; caja.style.height = "auto";
    var w = boton.offsetWidth + 2;
    caja.style.width = w + "px"; caja.style.height = "38px";
    $("idioma").style.width = w + "px";
  }
  function abrirIdioma(abrir) {
    caja.classList.toggle("abierta", abrir);
    boton.setAttribute("aria-expanded", abrir);
    if (abrir) { caja.style.width = Math.max(200, boton.offsetWidth + 2) + "px"; caja.style.height = (38 + $("idiomaLista").offsetHeight) + "px"; }
    else medirCerrada();
  }
  boton.onclick = function () { abrirIdioma(!caja.classList.contains("abierta")); };
  document.addEventListener("click", function (e) { if (caja.classList.contains("abierta") && !caja.contains(e.target)) abrirIdioma(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && caja.classList.contains("abierta")) { abrirIdioma(false); boton.focus(); } });
  IDIOMAS.forEach(function (x, i) {
    var li = document.createElement("li"), b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "menuitem"); b.textContent = x[1]; b.dataset.l = x[0]; b.style.setProperty("--i", i);
    b.lang = x[0];
    b.onclick = function () { lang = x[0]; grabar("cyl-idioma", lang); abrirIdioma(false); aplicarIdioma(); };
    li.appendChild(b); $("idiomaLista").appendChild(li);
  });
  // ---------- Tema claro / oscuro ----------
  var TEMA = { es: ["Modo claro", "Modo oscuro"], en: ["Light mode", "Dark mode"], fr: ["Mode clair", "Mode sombre"], it: ["Modalità chiara", "Modalità scura"], zh: ["浅色模式", "深色模式"],
    ja: ["ライトモード", "ダークモード"], ko: ["라이트 모드", "다크 모드"], de: ["Heller Modus", "Dunkler Modus"], ar: ["الوضع الفاتح", "الوضع الداكن"], ga: ["Mód geal", "Mód dorcha"] };
  function claro() { return document.documentElement.dataset.theme === "light"; }
  function etiquetaTema() { var t = TEMA[lang] || TEMA.en; $("tema").setAttribute("aria-label", claro() ? t[1] : t[0]); $("tema").title = claro() ? t[1] : t[0]; }
  $("tema").onclick = function () {
    var cambiar = function () {
      if (claro()) delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = "light";
      grabar("cyl-tema", claro() ? "light" : "dark"); etiquetaTema();
    };
    if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(cambiar); else cambiar();
  };

  function aplicarIdioma() {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = T("title");
    document.querySelectorAll("[data-t]").forEach(function (el) { el.textContent = T(el.dataset.t); });
    $("idiomaNombre").textContent = IDIOMAS.find(function (x) { return x[0] === lang; })[1];
    boton.setAttribute("aria-label", T("idioma")); etiquetaTema();
    $("preajuste").options[0].textContent = T("ninguna");
    document.querySelectorAll("#idiomaLista button").forEach(function (b) { b.setAttribute("aria-current", b.dataset.l === lang); });
    medirCerrada();
    letras(); simbolos(); vista();
    escribirPlaceholder($("texto")); escribirPlaceholder($("textoLetras"));
  }

  // ---------- Controles ----------
  function llenar(sel, items, val) {
    sel.innerHTML = items.map(function (x) { return '<option value="' + esc(x[0]) + '"' + (x[0] === val ? " selected" : "") + ">" + esc(x[1]) + "</option>"; }).join("");
  }
  if (leerEnlace()) {
    $("texto").value = S.texto;
    ["negrita", "cursiva", "subrayado", "tachado"].forEach(function (k) { $(k).checked = S[k]; });
  }
  llenar($("formato"), FORMATOS, S.formato);
  llenar($("preajuste"), PREAJUSTES.map(function (p) { return [p[0], p[0]]; }), "Cielo");

  ["colores", "letras", "simbolos"].forEach(function (p) { $("tab-" + p).onclick = function () { pestana(p); }; });
  $("textoLetras").oninput = function () { letras(); };
  document.querySelectorAll("[data-vista]").forEach(function (b) {
    b.onclick = function () {
      S.vista = b.dataset.vista;
      document.querySelectorAll("[data-vista]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
      escena();
    };
  });
  document.querySelectorAll("[data-modo]").forEach(function (b) {
    b.onclick = function () {
      S.modoSimbolo = b.dataset.modo;
      document.querySelectorAll("[data-modo]").forEach(function (x) { x.setAttribute("aria-pressed", x === b); });
    };
  });
  $("texto").oninput = function (e) { S.texto = e.target.value; vista(); };
  ["negrita", "cursiva", "subrayado", "tachado"].forEach(function (k) { $(k).onchange = function (e) { S[k] = e.target.checked; vista(); }; });
  $("formato").onchange = function (e) { S.formato = e.target.value; vista(); };
  $("preajuste").onchange = function (e) {
    var p = PREAJUSTES.find(function (x) { return x[0] === e.target.value; });
    if (p && p[1]) { S.colores = p[1].slice(); S.fijos = p[1].map(function () { return false; }); paleta("todas"); vista(); }
  };
  $("mas").onclick = function () {
    S.colores.push(hsl(tono(S.colores[S.colores.length - 1]) + 35, 80, 64)); S.fijos.push(false);
    $("preajuste").value = "-"; paleta(S.colores.length - 1); vista();
  };
  $("menos").onclick = function () { S.colores.pop(); S.fijos.pop(); $("preajuste").value = "-"; paleta(); vista(); };
  $("dado").onclick = aleatorio;
  $("invertir").onclick = function () { S.colores.reverse(); S.fijos.reverse(); paleta(); vista(); };
  $("izq").onclick = function () { S.colores.push(S.colores.shift()); S.fijos.push(S.fijos.shift()); paleta(); vista(); };
  $("der").onclick = function () { S.colores.unshift(S.colores.pop()); S.fijos.unshift(S.fijos.pop()); paleta(); vista(); };
  $("compartir").onclick = function () { copiar(enlace(), null, T("enlaceCopiado")); };
  $("copiar").onclick = function () { if ($("codigo").value) copiar($("codigo").value, $("codigo")); };
  $("cargar").onclick = cargarCodigo;
  $("pegado").onkeydown = function (e) { if (e.key === "Enter") cargarCodigo(); };

  paleta("todas"); pintarRecientes(); aplicarIdioma();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(medirCerrada);
})();
</script>
